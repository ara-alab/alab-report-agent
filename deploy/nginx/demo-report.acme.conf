# 발급 단계용(80 블록만) — 인증서 발급 전 임시 배치
# 배치 위치: 서버 드롭인 디렉터리의 demo-report.conf (최종본과 같은 파일명 — 덮어쓰기로 교체)
# 용도: ACME 챌린지 응답 경로 확보 — 이 블록이 없으면 webroot 발급이 404 로 실패

server {
    listen 80;
    server_name report.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
