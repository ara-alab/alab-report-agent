# report.example.com — alabReport 목업 앞단(별도 compose 프로젝트 `alab-report`)
#
# 최종본(80+443) — 인증서 발급 완료 후 반영
# 배치 위치: 서버의 프록시 nginx 가 include 하는 드롭인 디렉터리 — demo-report.conf
# 발급 전 단계는 demo-report.acme.conf 를 같은 이름으로 먼저 배치 — 인증서 부재 시 nginx -t 실패로 반영 무산
# upstream 을 변수로 두는 이유 — 리터럴 호스트명은 기동 시 해석이라 목업 컨테이너 부재 시 nginx 전체 기동 실패
#       변수+resolver 는 요청 시점 해석이라 최악이 이 도메인만 502(운영 도메인 무영향)

# --- HTTP(80): ACME 챌린지 + HTTPS 리다이렉트 ---
server {
    listen 80;
    server_name report.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS(443): TLS 종료 + 목업 컨테이너 프록시 ---
server {
    listen 443 ssl;
    http2 on;
    server_name report.example.com;

    ssl_certificate     /etc/letsencrypt/live/report.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/report.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/conf.d/security-headers.conf;   # 자체 add_header 가 상위 상속을 끊음 — 공통 헤더 재-include

    # 목업 정적 파일 — 갱신 즉시 반영, 캐시 잔존 시 배포분 미노출
    location /report-mockup/ {
        resolver 127.0.0.11 valid=10s ipv6=off;        # Docker 임베디드 DNS — 컨테이너명 런타임 해석
        set $report_upstream "alab-report:3000";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$report_upstream;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $report_upstream "alab-report:3000";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$report_upstream;
    }
}
